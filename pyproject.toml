[project]
name = "skillalign"
version = "0.1.0"
description = "Detect mismatches between what agent skills claim and what they do"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.4",
    "openai>=1.50",
    "pydantic>=2.8",
    "pyyaml>=6.0.3",
    "typer>=0.12",
]

[project.scripts]
skillalign = "skillalign.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["tests/fixtures"]  # sample skills under test, not our code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
